[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcc-claude-code-studio"
version = "1.0.0"
description = "Claude Code Studio (FCC) - a native desktop GUI for the Claude Code CLI, styled like the Claude app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FCC" }]
dependencies = ["PySide6>=6.6,<7", "Pygments>=2.17"]

[project.scripts]
fcc = "fcc.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
